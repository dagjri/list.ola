<script>

 have:{n:'所持リスト',sub:'すべてのジャンル',d:'',g:GENRES,l:'have'},

 fav:{n:'お気に入り',sub:'この端末に保存（ログイン不要）',d:'',g:GENRES,l:'have',fav:1}
};
