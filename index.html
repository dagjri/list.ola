<style>
:root{--bg:#fff;--fg:#000;--mu:#6b6b6b;--ln:#d9d9d9;--soft:#f4f4f4}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--mu:#a3a3a3;--ln:#2e2e2e;--soft:#121212}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--fg);border-radius:0;padding:6px 12px;min-height:36px}
input,select,textarea{font-size:16px}
button{cursor:pointer}button.on{background:var(--fg);color:var(--bg)}
button.ghost{border-color:transparent;padding:6px 8px}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.in{max-width:760px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--fg)}

#eb button{background:var(--bg);color:var(--fg);border-color:var(--bg);min-height:30px;padding:2px 12px}
#eb span{flex:1}
main.in{padding-top:24px;padding-bottom:40px;min-height:70vh}
.back{display:inline-block;font-size:13px;color:var(--mu);text-decoration:none;margin-bottom:8px}
h1{font-size:24px;line-height:1.3;margin:0 0 4px;letter-spacing:.02em}
.sub{margin:0 0 18px;color:var(--mu);font-size:13px}
h2{font-size:18px;margin:4px 0 8px}
h4{font-size:12px;letter-spacing:.16em;color:var(--mu);margin:22px 0 6px;font-weight:600}
.hint{color:var(--mu);font-size:12px;margin:10px 0}
.box{border:1px solid var(--fg);padding:12px 14px;margin:0 0 22px;font-size:14px;white-space:pre-wrap}

.menu{border-top:1px solid var(--fg);margin:0;padding:0;list-style:none}

@media(hover:hover){.menu a:hover{background:var(--fg);color:var(--bg)}.menu a:hover *{color:var(--bg)}}
.menu a:active{background:var(--fg);color:var(--bg)}.menu a:active *{color:var(--bg)}

.tabs i{font-style:normal;font-size:11px;margin-left:4px}
.ch{margin-top:12px}.ch span{display:inline-block;border:1px solid var(--fg);padding:0 10px;margin:0 6px 6px 0;font-size:13px;cursor:pointer}

@media(hover:hover){.r:hover{background:var(--soft)}}
.r:active{opacity:.55}
.gl{font-size:11px;color:var(--mu);letter-spacing:.08em}
.tt{font-weight:600;word-break:break-word}
.m{font-size:12px;color:var(--mu)}

.p.g{border-color:var(--fg);font-weight:700}
.b{display:inline-block;border:1px solid var(--fg);font-size:10px;padding:0 5px;margin-left:6px;line-height:1.5;vertical-align:1px}
.pg{white-space:pre-wrap;word-break:break-word}
.pg a{text-underline-offset:3px}
.empty{color:var(--mu);padding:30px 0;text-align:center;font-size:13px}
.ppl{border-top:1px solid var(--fg);margin-top:18px;padding-top:10px}
.ppl h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ppl h3 button{font-size:12px;min-height:28px;padding:1px 10px}
.ppl .cl{margin:8px 0 0}
.chip{display:inline-block;border:1px solid var(--fg);padding:1px 11px;margin:0 6px 7px 0;font-size:13px;cursor:pointer;background:var(--bg);min-height:0}
.chip i{font-style:normal;color:var(--mu);margin-left:5px;font-size:11px}
.chip.on{background:var(--fg);color:var(--bg)}.chip.on i{color:var(--bg)}
.lk{display:block;padding:14px 2px;border-bottom:1px solid var(--ln);text-decoration:none}
.lk b{display:block}.lk small{color:var(--mu);font-size:12px}
.guide{counter-reset:s;margin:0;padding:0;list-style:none}
.guide li{counter-increment:s;padding:12px 0 12px 40px;border-bottom:1px solid var(--ln);position:relative}
.guide li:before{content:counter(s,decimal-leading-zero);position:absolute;left:2px;top:14px;font:12px/1 ui-monospace,Menlo,monospace;color:var(--mu)}
.guide b{display:block}
footer.in{margin-top:0;padding-top:16px;padding-bottom:40px;font-size:12px;color:var(--mu)}
footer.in:before{content:'';display:block;border-top:1px solid var(--fg);margin:0 0 14px}
footer a{margin-right:14px}
#sh{position:fixed;inset:0;background:#0009;display:none;z-index:9;justify-content:flex-end;overscroll-behavior:contain}#sh.on{display:flex}
#pn{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;overscroll-behavior:contain;padding:16px 18px 50px;border-left:1px solid var(--fg)}
.k{padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.k small{color:var(--mu);display:block}
.ro{border:1px solid var(--ln);padding:8px 12px;margin:10px 0;font-size:13px}.ro b{margin-right:8px}
.fg label{display:block;font-size:12px;color:var(--mu);margin-top:12px}.fg input,.fg select,.fg textarea{width:100%}.fg textarea{min-height:130px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lkrow{border:1px solid var(--ln);padding:10px;margin:0 0 10px}.lkrow input{width:100%;margin-bottom:6px}
.ld{display:flex;align-items:center;justify-content:center;gap:12px;padding:90px 0;color:var(--mu);font-size:13px;letter-spacing:.08em}
.ld i{width:18px;height:18px;border:2px solid var(--ln);border-top-color:var(--fg);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ld i{animation-duration:3s}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;font-size:13px;z-index:20;display:none}
.r{position:relative;padding-right:40px}.r .fv{position:absolute;right:0;top:8px}
.fv{border:0;background:none;min-height:36px;min-width:36px;padding:0;font-size:20px;line-height:1;color:var(--fg)}h2 .fv{vertical-align:middle}
.vw .back,.vw #ft,.vw #bl{display:none}
.ep{display:grid;grid-template-columns:84px 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--ln)}.ep .d{font:12px/1.9 ui-monospace,Menlo,Consolas,monospace;color:var(--mu)}.ep .w{font-size:14px;line-height:1.8}.ep .w b{border-bottom:2px solid var(--fg)}.ep .b{margin-left:0;margin-right:6px}
.yh{margin:18px 0 0;font-size:12px;letter-spacing:.2em;color:var(--mu);border-bottom:1px solid var(--fg);padding-bottom:3px;font-weight:600}
.b.hot{background:var(--fg);color:var(--bg)}
.sh{margin:22px 0 2px;font-size:13px;font-weight:700;letter-spacing:.12em;border-bottom:1px solid var(--fg);padding-bottom:3px}.sh i{font-style:normal;font-weight:400;color:var(--mu);font-size:11px;margin-left:8px;letter-spacing:0}
</style>

<body>
<header><div class="in bar"><a href="#/" id="brand">list.ola</a><nav><button class="ghost" id="bs" hidden>検索</button><button class="ghost" id="bl" hidden>ログイン</button></nav></div></header>
<div id="eb" hidden><div class="in"><span id="ebt"></span><button id="sv">保存</button><button id="ex">編集を終了</button></div></div>
<main class="in" id="app"><div class="ld" role="status"><i></i>読み込み中…</div></main>
<footer class="in" id="ft"></footer>
<div id="sh"><div id="pn"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
/* ================= 設定・定数 ================= */
const C=window.CFG||{},SK='ola.session';
const GENRES=['ドラマ','映画','ドキュメンタリー','バラエティ','音楽番組','ラジオ','ライブ・配信','円盤・特典','音源'];
const OWN=['配布可','要相談','配布不可'];
const WANT=['激求め','求め','あれば'],PI=p=>{const x=WANT.indexOf(p);return x<0?WANT.length:x};
const LISTS={
 have:{n:'所持リスト',sub:'すべてのジャンル',d:'',g:GENRES,l:'have'},
 want:{n:'求めリスト',sub:'探しているもの',d:'探している作品・音源',g:GENRES,l:'want'},
 fav:{n:'お気に入り',sub:'この端末に保存（ログイン不要）',d:'',g:GENRES,l:'have',fav:1}
};
const DEF={title:'list.ola',notice:'',groups:{},pages:{must:'',terms:''},links:[],items:[]};

/* ================= 状態 ================= */
let D,S=null,ed=false,dirty=false,lim=60,em='',keepF=false,LK='',AT=0,ver=0,saving=false,SY=0,AN=null,NA=null;
let f={q:'',g:[],w:[],o:[]},tab='すべて';
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VW=new URLSearchParams(location.search).get('v')=='have';if(VW)document.documentElement.classList.add('vw');
const route=()=>VW?'have':location.hash.replace(/^#\/?/,'').split('?')[0];
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)};
const linkify=s=>e(s).replace(/https?:\/\/[^\s<>"']+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

/* ================= 追加機能 ================= */
const FK='ola.fav';let FAV=new Set(),DP=null;try{FAV=new Set(JSON.parse(localStorage.getItem(FK))||[])}catch(x){}
const fk=i=>i.t+'|'+i.g,isF=i=>FAV.has(fk(i)),inL=(i,L)=>L.fav?isF(i):i.l==L.l;
const togF=i=>{const k=fk(i);FAV.has(k)?FAV.delete(k):FAV.add(k);try{localStorage.setItem(FK,JSON.stringify([...FAV]))}catch(x){}};
const rt=()=>{const b=$('.tabs');if(b)b.scrollLeft=0};
const copy=async s=>{try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch(x){prompt('コピーしてください',s)}};
const dinfo=i=>[['求め度',i.l=='want'?i.p:''],['配布',i.o],['配布方法',i.m],['画質',i.q],['交換比率',VW?'':i.r],['有償時の値段',VW?'':i.c]].filter(a=>a[1]).map(a=>`<div class="ro"><b>${a[0]}</b>${e(a[1])}</div>`).join('');
const DR=/(\d{4})[.\/\-年](\d{1,2})[.\/\-月](\d{1,2})日?/;
const csvSplit=l=>{const o=[];let c='',q=0;for(const ch of l){if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o};
function rowK(p){p=p.map(a=>a.trim());const m=p[0].match(DR);
 if(m&&m.index==0&&p[0].replace(DR,'').trim()==''&&!DR.test(p[1]||'')){const d=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');return[d,d,'放送回',[p[1]?'出演者: '+p[1]:'',p[2]||''].filter(Boolean).join(' / ')]}
 return[p[0]||'',p[1]||'',p[2]||'',p[3]||'']}
function parseK(tx){const o=[];let c=null;
 tx.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||/^アイテム名/.test(l))return;
  if(/[|\t]/.test(l)||/^\d{4}[.\/\-]\d{1,2}[.\/\-]\d{1,2}\s*,/.test(l)){o.push(rowK(/[|\t]/.test(l)?l.split(/[|\t]/):csvSplit(l)));c=null;return}
  const h=l.replace(/^#+\s*/,''),m=h.match(DR);
  if(m&&m.index==0){const d=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');c=[d,d,'放送回',h.slice(m[0].length).replace(/^[\s　:：,，]+/,'')];o.push(c)}
  else if(c)c[3]=(c[3]?c[3]+' / ':'')+h;
  else o.push([h,'','',''])});return o}
function mergeK(i,a){const K=k=>k[0]+'|'+k[1],m=new Map(i.k.map(k=>[K(k),k]));a.forEach(k=>m.set(K(k),k));i.k=[...m.values()].sort(kcmp)}
const KW=/^(本編|特典映像|映像特典|特典|メイキング|ボーナス映像|コメンタリー)$/;
const kv=k=>KW.test(k[0])&&!k[2]&&k[3]?[k[3],k[1],k[0],'']:k;
const en=k=>{const q=(k[0]||'').match(/\d+/);return q?+q[0]:1e9};
const kcmp=(x,y)=>{const a=x[1]||'~',b=y[1]||'~';return a==b?en(x)-en(y):a.localeCompare(b)};
const mk=()=>touch();
function shareL(){copy(location.href.split('#')[0].split('?')[0]+'?v=have#/have')}
let KQ='',KL=80,KI=0;
const wsF=()=>f.w.flatMap(w=>D.groups[w]||[w]).map(a=>a.toLowerCase());
function hitK(i){const q=f.q.toLowerCase().split(/\s+/).filter(Boolean),ws=wsF();if(!q.length&&!ws.length)return'';
 const h=i.k.filter(k=>{const s=k.join(' ').toLowerCase();return q.every(w=>s.includes(w))&&(!ws.length||ws.some(w=>s.includes(w)))});
 return h.length?'　<b>該当 '+h.length+'回</b>'+(h.length<=5?'：'+h.map(k=>e(k[1]||k[0])).join('、'):''):''}
let QW=new Set();
const perf=i=>{const c={};i.k.forEach(k=>{const m=(k[3]||'').match(/出演者[:：]\s*([^/]*)/);if(m)m[1].split(/[,、，]/).map(a=>a.trim()).filter(Boolean).forEach(a=>c[a]=(c[a]||0)+1)});return c};
const kchips=i=>{const s=new Set(['本編','特典映像','メイキング']);i.k.map(kv).forEach(k=>{if(k[2]&&k[2]!='放送回')s.add(k[2])});return[...s].map(v=>`<button type="button" class="chip ${v==LK?'on':''}" data-ks="${e(v)}">${e(v)}</button>`).join('')};
const qchips=i=>{const c=perf(i);i.w.forEach(w=>(D.groups[w]||[w]).forEach(a=>{c[a]=c[a]||0}));QW.forEach(a=>c[a]=c[a]||0);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,60).map(a=>`<button type="button" class="chip ${QW.has(a[0])?'on':''}" data-qw="${e(a[0])}">${e(a[0])}</button>`).join('')};
function klist(i){const q=KQ.toLowerCase().split(/\s+/).filter(Boolean),r=i.k.filter(k=>{const s=k.join(' ').toLowerCase();return q.every(w=>s.includes(w))}).map(kv);
 const G=[...new Set(r.map(k=>k[2]).filter(x=>x&&x!='放送回'))];let y='',h='',c=0;
 if(!G.length){r.slice(0,KL).forEach(k=>{const d=k[1]||k[0],yy=/^\d{4}[-.]/.test(d)?d.slice(0,4):'';if(yy&&yy!=y&&r.length>12){y=yy;h+=`<div class="yh">${yy}</div>`}h+=kh(k)})}
 else{const rr=r.slice().sort(kcmp);for(const g of [...G,'']){const rs=rr.filter(k=>g?k[2]==g:(!k[2]||k[2]=='放送回'));if(!rs.length||c>=KL)continue;h+=`<div class="sh">${e(g||'その他')}<i>${rs.length}</i></div>`;for(const k of rs){if(c>=KL)break;h+=kh(k,1);c++}}}
 const shown=G.length?c:Math.min(r.length,KL);
 return(q.length?`<p class="hint">${r.length}回</p>`:'')+h+(r.length>shown?`<p><button data-a="kmore">さらに表示（残り${r.length-shown}件）</button></p>`:'')}
function kbox(i){const c=perf(i),ch=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,60);if(!ch.length)KQ='';
 return`<h4>収録内容 ${i.k.length}件</h4>${ch.length?`<div class="fg"><input id="kq" placeholder="名前・日付で絞り込み" value="${e(KQ)}"></div><details style="margin-top:8px"><summary class="hint" style="cursor:pointer">出演者から選ぶ（${Object.keys(c).length}人）</summary><div style="margin-top:6px">${ch.map(a=>`<button class="chip" data-kq="${e(a[0])}">${e(a[0])}<i>${a[1]}</i></button>`).join('')}</div></details>`:''}<div id="kl">${klist(i)}</div>`}
function inst(){if(DP){DP.prompt();DP=null}else if(matchMedia('(display-mode:standalone)').matches||navigator.standalone)toast('すでにホーム画面から開いています');else alert(/iPhone|iPad|iPod/.test(navigator.userAgent)?'Safariの共有ボタン（□↑）から「ホーム画面に追加」を選んでください':'ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選んでください')}
/* ================= Supabase（ログイン・保存） ================= */
const sb=(p,o={})=>fetch(C.url+p,{method:o.method||'GET',body:o.body,headers:{apikey:C.key,'Content-Type':'application/json',...((o.tk||!/^sb_/.test(C.key))?{Authorization:'Bearer '+(o.tk||C.key)}:{}),...(o.h||{})}});
const ses=j=>{S={a:j.access_token,r:j.refresh_token,exp:Date.now()/1000+j.expires_in};try{localStorage.setItem(SK,JSON.stringify(S))}catch(x){}};
async function tok(){if(!S)return null;if(S.exp<Date.now()/1000+60){try{const r=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:S.r})});if(!r.ok){out();return null}ses(await r.json())}catch(x){return null}}return S.a}
function out(){clearTimeout(AT);S=null;ed=false;dirty=false;try{localStorage.removeItem(SK)}catch(x){}}
const stTxt=()=>{const t=$('#ebt');if(t)t.textContent='編集モード'+(saving?'　保存中…':dirty?'　●未保存':'　✓保存済み')};
function touch(){if(VW)return;dirty=true;ver++;const b=$('#sv');if(b)b.disabled=saving;stTxt();clearTimeout(AT);AT=setTimeout(()=>saveDB(true),1200)}
async function saveDB(auto){clearTimeout(AT);if(VW)return;
 if(saving){AT=setTimeout(()=>saveDB(auto),700);return}
 if(auto===true&&!dirty)return;
 const sv=$('#sv');saving=true;sv.disabled=true;sv.textContent='保存中…';stTxt();let r='fail';
 try{r=await saveDB2(auto===true)}finally{saving=false;sv.textContent='保存';sv.disabled=!dirty;stTxt()}
 if(r=='ok'&&dirty)AT=setTimeout(()=>saveDB(true),600);else if(r=='retry'&&dirty)AT=setTimeout(()=>saveDB(true),15000)}
async function saveDB2(auto){const say=m=>auto?toast(m):alert(m);
 const t=await tok();if(!t){say('ログインが切れました。もう一度ログインしてください');render();return'fail'}
 const my=ver;
 try{const r=await sb('/rest/v1/archive?on_conflict=id',{method:'POST',h:{Prefer:'resolution=merge-duplicates,return=minimal'},tk:t,body:JSON.stringify({id:1,data:D})});
  if(r.ok){if(my==ver)dirty=false;toast(auto?'自動保存しました':'保存しました');return'ok'}
  say('保存できませんでした（編集できるのは管理者だけです）');return'fail'}
