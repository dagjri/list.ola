<style>
:root{--bg:#fff;--fg:#000;--mu:#6b6b6b;--ln:#d9d9d9;--soft:#f4f4f4}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

a{color:inherit}

input,select,textarea{font-size:16px}
button{cursor:pointer}button.on{background:var(--fg);color:var(--bg)}

#eb button{background:var(--bg);color:var(--fg);border-color:var(--bg);min-height:30px;padding:2px 12px}
#eb span{flex:1}
main.in{padding-top:24px;padding-bottom:40px;min-height:70vh}

.menu a:active{background:var(--fg);color:var(--bg)}.menu a:active *{color:var(--bg)}

.p{display:inline-block;border:1px solid var(--mu);padding:0 8px;font-size:12px;margin:3px 4px 2px 0;cursor:pointer;line-height:1.7}
.p.g{border-color:var(--fg);font-weight:700}
.wor{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--bd,var(--ln));border-radius:10px;padding:4px 6px 4px 12px;margin:0 0 6px}.wor button{min-height:34px;min-width:40px;padding:0 8px;margin-left:4px}
a.dlk.elk{display:inline-flex;justify-content:flex-start;gap:5px;padding:2px 12px;border-radius:999px;margin:6px 6px 0 0;font-size:13px;line-height:1.7;min-height:0}a.dlk.elk b{display:inline;font-size:13px;font-weight:600;border:0}a.dlk.elk span{font-size:12px}.dlkrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0}.dlkrow .dlk{margin:0}.lkcopy{font-size:11px;min-height:28px;padding:2px 9px;border-style:dashed}
.wd{display:block}.wd summary{cursor:pointer;list-style:none;font-size:13px}.wd summary::-webkit-details-marker{display:none}.wd summary::after{content:' ▾';color:var(--mu)}.wd[open] summary::after{content:' ▴'}.wd .wc{font-weight:600}.wd .wp{color:var(--mu);margin-left:8px}.wd[open] .wp{display:none}.wd[open] summary{margin-bottom:2px}
.k small,.ep .b{white-space:pre-wrap}.b{display:inline-block;border:1px solid var(--fg);font-size:10px;padding:0 5px;margin-left:6px;line-height:1.5;vertical-align:1px}
.pg{white-space:pre-wrap;word-break:break-word}
.pg a{text-underline-offset:3px}
.empty{color:var(--mu);padding:30px 0;text-align:center;font-size:13px}
.ppl{border-top:1px solid var(--fg);margin-top:18px;padding-top:10px}
.ppl h3{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ppl h3 button{font-size:12px;min-height:28px;padding:1px 10px}
.ppl .cl{margin:8px 0 0}

.chip i{font-style:normal;color:var(--mu);margin-left:5px;font-size:11px}
.chip.on{background:var(--fg);color:var(--bg)}.chip.on i{color:var(--bg)}
.lk{display:block;padding:14px 2px;border-bottom:1px solid var(--ln);text-decoration:none}
.lk b{display:block}.lk small{color:var(--mu);font-size:12px}
.guide{counter-reset:s;margin:0;padding:0;list-style:none}
.guide li{counter-increment:s;padding:12px 0 12px 40px;border-bottom:1px solid var(--ln);position:relative}
.guide li:before{content:counter(s,decimal-leading-zero);position:absolute;left:2px;top:14px;font:12px/1 ui-monospace,Menlo,monospace;color:var(--mu)}
.guide b{display:block}
footer.in{margin-top:0;padding-top:16px;padding-bottom:40px;font-size:12px;color:var(--mu)}
footer.in:before{content:'';display:block;border-top:1px solid var(--fg);margin:0 0 14px}
footer a{margin-right:14px}
#sh{position:fixed;inset:0;background:#0009;display:none;z-index:9;justify-content:flex-end;overscroll-behavior:contain}#sh.on{display:flex}
#pn{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;overscroll-behavior:contain;padding:16px 18px 50px;border-left:1px solid var(--fg)}
.k{padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}.k small{color:var(--mu);display:block}
.ro{border:1px solid var(--ln);padding:8px 12px;margin:10px 0;font-size:13px}.ro b{margin-right:8px}
.fg label{display:block;font-size:12px;color:var(--mu);margin-top:12px}.fg input,.fg select,.fg textarea{width:100%}.fg textarea{min-height:130px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.lkrow{border:1px solid var(--ln);padding:10px;margin:0 0 10px;overflow:hidden}.lkrow input{width:100%;margin-bottom:6px}
input[type=date]{display:block;width:100%;min-width:0;max-width:100%;min-height:36px;-webkit-appearance:none;appearance:none;text-align:left}
.ld{display:flex;align-items:center;justify-content:center;gap:12px;padding:90px 0;color:var(--mu);font-size:13px;letter-spacing:.08em}
.ld i{width:18px;height:18px;border:2px solid var(--ln);border-top-color:var(--fg);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ld i{animation-duration:3s}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;font-size:13px;z-index:20;display:none}
.r{position:relative;padding-right:40px}.r .fv{position:absolute;right:0;top:8px}
.fv{border:0;background:none;min-height:36px;min-width:36px;padding:0;font-size:20px;line-height:1;color:var(--fg)}h2 .fv{vertical-align:middle}
.vw .back,.vw #ft,.vw #bl{display:none}
.wsw{display:block;position:relative}.ws{display:block;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.ws::-webkit-scrollbar{display:none}.wsw.more::after{content:'スライドで続き ›';position:absolute;right:0;top:0;bottom:2px;display:flex;align-items:center;padding:0 2px 0 28px;font-size:11px;color:var(--mu);background:linear-gradient(to right,transparent,var(--bg) 60%);pointer-events:none}
.ep{display:grid;grid-template-columns:84px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--ln)}.ep .d{font:12px/1.9 ui-monospace,Menlo,Consolas,monospace;color:var(--mu)}.ep .w{min-width:0;font-size:14px;line-height:1.8}.ep .w b{border-bottom:2px solid var(--fg)}.ep .b{margin-left:0;margin-right:6px}
.yh{margin:18px 0 0;font-size:12px;letter-spacing:.2em;color:var(--mu);border-bottom:1px solid var(--fg);padding-bottom:3px;font-weight:600}
.b.hot{background:var(--fg);color:var(--bg)}
.ssh{margin:12px 0 2px;font-size:12px;font-weight:700;color:var(--mu);padding-left:8px;border-left:3px solid var(--fg)}.ssh i{font-style:normal;font-weight:400;font-size:11px;margin-left:8px}.gbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--fg);font-size:13px}.gbar.sub{margin-left:10px;border-bottom:1px dashed var(--ln);font-size:12px}.gbar b i{font-style:normal;font-weight:400;color:var(--mu);font-size:11px;margin-left:8px}.mvb{display:flex;gap:4px;flex:none}.mvb button{min-width:40px;min-height:36px}
.sh{margin:22px 0 2px;font-size:13px;font-weight:700;letter-spacing:.12em;border-bottom:1px solid var(--fg);padding-bottom:3px}.sh i{font-style:normal;font-weight:400;color:var(--mu);font-size:11px;margin-left:8px;letter-spacing:0}
.lp{position:sticky;top:0;z-index:2;background:var(--bg);border:1px solid var(--fg);padding:4px 10px;margin:6px 0;max-height:34vh;overflow:auto;pointer-events:none}
.fbar{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;background:var(--bg);border-top:1px solid var(--fg);padding:10px 0;margin-top:16px}.fbar button{min-height:44px}

/* ===== デザイン調整：枠（カード）で統一 ===== */
:root{--bd:#c9c9c9;--rad:14px}
@media(prefers-color-scheme:dark){:root{--bd:#4a4a4a}}
button,input,select,textarea{border-color:var(--bd);border-radius:10px;padding:7px 14px}
button{border-radius:999px;border-color:var(--fg)}button.ghost{border-color:transparent}
button.chip,button.fv{border-color:var(--bd)}button.fv{border-color:transparent}
input:focus,select:focus,textarea:focus{border-color:var(--fg);outline:0}
header{border-bottom-color:var(--ln)}
h1{margin-bottom:6px}.sub{margin-bottom:20px}
.box{border-color:var(--bd);border-radius:var(--rad);background:var(--soft);padding:14px 16px}
.box b{border-radius:999px;padding:0 8px}
.menu{border-top:0}.menu li{margin:0 0 10px}
.menu a{border:1px solid var(--bd);border-radius:var(--rad);padding:14px 16px;column-gap:12px}
.tabs{border-bottom:0;gap:8px;padding:2px 18px 12px}
.tabs button{border:1px solid var(--bd);border-radius:999px;padding:5px 14px;color:var(--fg)}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ch span{border-radius:999px;border-color:var(--bd);padding:1px 12px}
.r{border:1px solid var(--bd);border-radius:var(--rad);padding:12px 46px 12px 14px;margin:0 0 10px}
.r .fv{right:4px;top:6px}.r .tt{line-height:1.5}.r .p,.r .m{margin-top:6px}
.gh,.sh,.yh{border:0;border-left:3px solid var(--fg);padding:1px 0 1px 10px;margin:28px 0 12px;line-height:1.3}
.yh{margin:18px 0 8px}
.p,.b,.chip{border-radius:999px}.p{border-color:var(--bd)}.p.g{border-color:var(--fg)}
.chip{border-color:var(--bd);padding:3px 12px}.chip.on{border-color:var(--fg)}
.b{padding:0 7px}
#pn{border-left:0;padding:16px 18px 60px}
@media(min-width:600px){#pn{border-radius:20px 0 0 20px}}
.ro{border-color:var(--bd);border-radius:12px;padding:10px 14px}
#kl{border:1px solid var(--bd);border-radius:var(--rad);padding:0 14px 6px;margin-top:10px}
#kl .ep:last-child,#kl .k:last-child{border-bottom:0}
.lp{border:1px dashed var(--mu);border-radius:var(--rad);padding:8px 12px}
.lp .r{border:0;padding:6px 40px 6px 0;margin:0}
.fr{border:1px solid var(--bd);border-radius:var(--rad);padding:6px 14px 14px;margin:14px 0}
.fr h4{margin:12px 0 8px}
.lkrow{background:var(--soft);border:0;border-radius:12px;padding:6px 12px 12px;margin:8px 0}
.fbar{border-top-color:var(--ln)}.fbar button{border-radius:999px;min-height:46px}
.dng{border-color:var(--mu);color:var(--mu)}
.ppl{border:1px solid var(--bd);border-radius:var(--rad);padding:12px 16px;margin-top:12px}
.guide li{border:1px solid var(--bd);border-radius:var(--rad);padding:12px 14px 12px 46px;margin:0 0 10px}.guide li:before{left:14px;top:15px}
.lk{border:1px solid var(--bd);border-radius:var(--rad);padding:12px 16px;margin:0 0 10px}
#toast{border-radius:999px}

/* ===== 四角・コンパクト調整 ===== */
:root{--rad:0}
button,input,select,textarea,.box,.box b,.menu a,.tabs button,.ch span,.r,.p,.b,.chip,.ro,#kl,.lp,.fr,.lkrow,.fbar button,.ppl,.guide li,.lk,#toast,#pn{border-radius:0 !important}
.b.ok{background:var(--fg);color:var(--bg)}.b.ng{border-style:dashed;color:var(--mu);border-color:var(--mu)}
.dg{display:flex;flex-wrap:wrap;gap:2px 16px;border:1px solid var(--bd);padding:6px 10px;margin:8px 0;font-size:13px}
.dg i{font-style:normal;color:var(--mu);font-size:11px;margin-right:6px}
.r{padding:9px 44px 9px 12px;margin:0 0 6px}.r .fv{top:3px}.r .p,.r .m{margin-top:4px}
.menu a{padding:11px 14px}.menu li{margin:0 0 8px}
.gh,.sh{margin:20px 0 8px}
#pn h2{margin:2px 0 4px}#pn .gl{margin:0}#pn .hint{margin:6px 0}
.ro{margin:6px 0;padding:5px 10px}.ro .p{margin:2px 4px 2px 0}
h4{margin:14px 0 6px}
.fr{margin:8px 0;padding:0 12px 10px}.fr h4{margin:10px 0 4px}
.fg label{margin-top:8px}input,select,textarea{min-height:34px}
.lp{padding:4px 10px;margin:4px 0}.lp .r{padding:4px 40px 4px 0}
.lkrow{padding:2px 10px 10px;margin:6px 0}

/* ===== トップ・ボタン・ノート・共有リンク ===== */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
main.in,footer.in{width:100%}main.in{flex:1 0 auto}
body.tp main.in{display:flex;flex-direction:column;justify-content:center;min-height:0;padding-top:24px;padding-bottom:24px}
body.tp footer.in{padding-bottom:24px}
.bar nav{align-items:center;gap:0}.bar nav>*{font-size:14px;line-height:1.2;min-height:36px;padding:0 8px;display:inline-flex;align-items:center;white-space:nowrap}
.hl{text-decoration:none;color:var(--fg)}
.vw .hl{display:none}
.nc{display:flex;gap:8px;margin:6px 0 4px}.nc button{min-height:30px;padding:2px 12px;font-size:13px}
.gtabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:6px;margin:10px 0 8px}.gtabs::-webkit-scrollbar{display:none}
.gtabs button{white-space:nowrap;min-height:0;padding:4px 14px;font-size:14px;border-color:var(--bd)}.gtabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.dl{margin:0 0 18px}.dl h4{margin-top:0}.dlb{display:grid;gap:8px}
.dlk{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--fg);padding:10px 14px;text-decoration:none}
.dlk b{display:block;font-size:15px}.dlk small{display:block;color:var(--mu);font-size:12px}
.dlk:active{background:var(--fg);color:var(--bg)}.dlk:active small{color:var(--bg)}
.bar nav>[hidden]{display:none}
#pn.fx{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
#pn.fx .fsc{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
#pn.fx .fbar{position:static;flex:none;margin-top:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}

#pn details.mt{border:1px solid var(--ln);background:var(--bg);margin:10px 0}
#pn details.mt>summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
#pn details.mt>summary::-webkit-details-marker{display:none}
#pn details.mt>summary:after{content:"＋";color:var(--mu);font-weight:400}
#pn details.mt[open]>summary:after{content:"－"}
#pn details.mt[open]>summary{border-bottom:1px solid var(--ln)}
#pn details.mt>.in{padding:2px 14px 14px}
#pn details.sec{background:var(--soft);margin:14px 0}
#pn details.sec>summary{font-size:15px;letter-spacing:.08em}
#pn .jmp{position:sticky;top:0;z-index:3;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 0;margin:0;border-bottom:1px solid var(--ln)}
#pn .jmp button{white-space:nowrap;flex:none;min-height:34px;padding:4px 12px;font-size:13px}
/* ===== 見かた：スワイプ式 ===== */
.gsl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:10px 0 0}
.gsl::-webkit-scrollbar{display:none}
.gsl>section{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:8px 16px 4px;text-align:center}
.gsl svg{width:min(240px,78%);height:auto;color:var(--fg)}
.gsl h3{margin:10px 0 6px;font-size:17px}.gsl p{margin:0 auto;max-width:30em;font-size:13px;line-height:1.7;color:var(--mu);min-height:5.2em}
.gdt{display:flex;justify-content:center;gap:8px;margin:8px 0 6px}.gdt i{width:7px;height:7px;border-radius:50%;background:var(--ln);transition:background .2s}.gdt i.on{background:var(--fg)}
/* ===== 編集画面：固定解除・スタイリッシュ調整 ===== */
.lp{position:static !important;max-height:none !important;pointer-events:auto;border:1px solid var(--ln);background:var(--soft);padding:10px 14px}
#pn:not(.fx) .fg{counter-reset:sec}
#pn:not(.fx) .fr{background:var(--soft);border:1px solid var(--ln);padding:4px 16px 18px;margin:18px 0}
#pn:not(.fx) .fr h4{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;letter-spacing:.14em}
#pn:not(.fx) .fr h4:before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font-size:11px;font-weight:400;color:var(--mu);letter-spacing:.08em}
